[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghstars"
version = "0.2.0"
description = "Sync your GitHub stars into a local, searchable knowledge base (Markdown + SQLite FTS5, Chinese-friendly)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "zhe97396-tech" }]
keywords = ["github", "stars", "bookmarks", "knowledge-base", "search", "fts5", "obsidian", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.urls]
Homepage = "https://github.com/zhe97396-tech/ghstars"
Repository = "https://github.com/zhe97396-tech/ghstars"
Issues = "https://github.com/zhe97396-tech/ghstars/issues"
Changelog = "https://github.com/zhe97396-tech/ghstars/blob/master/CHANGELOG.md"

[project.scripts]
ghstars = "ghstars.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
